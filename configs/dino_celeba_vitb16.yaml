# DINO + MFASSL pretraining on CelebA-HQ, ViT-B/16.
base: base.yaml

framework: dino
device: cuda

backbone:
  name: vit_base_patch16_224
  img_size: 224

pretrain:
  base_lr: 5.0e-4
  weight_decay: 0.04
  warmup_epochs: 10
  batch_size: 256
  teacher_momentum: 0.996

data:
  name: celeba
  root: /path/to/CelebA-HQ
  num_classes: 40

log:
  out_dir: runs/dino_celeba_vitb16
