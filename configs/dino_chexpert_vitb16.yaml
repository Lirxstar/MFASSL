# DINO + MFASSL on CheXpert, ViT-B/16.
base: base.yaml

framework: dino
device: cuda

backbone:
  name: vit_base_patch16_224
  img_size: 224

data:
  name: chexpert
  root: /path/to/CheXpert-v1.0
  csv_file: train.csv
  num_classes: 14
  u_policy: zeros
  batch_size: 256

pretrain:
  epochs: 300
  base_lr: 5.0e-4
  weight_decay: 0.04
  warmup_epochs: 10
  batch_size: 256
  teacher_momentum: 0.996

log:
  out_dir: runs/dino_chexpert_vitb16
