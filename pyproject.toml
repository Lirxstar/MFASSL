[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mfassl"
version = "0.1.0"
description = "Mirror-Fusion-Augmented Self-Supervised Learning (MFASSL)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.27",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "pillow==10.2.0",
]

[project.optional-dependencies]

metrics = ["scikit-learn>=1.1"]
medical = ["nibabel~=5.3", "scipy==1.11.4"]

[tool.setuptools.packages.find]
include = ["mfassl*"]
